name: CI/CD React to On-Prem K8s

on:
  push:
    branches:
      - main

jobs:
  ci-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        run: |
          npm install
          npm run lint

  build-and-push:
    needs: ci-testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t hello-react:1.0.0 .
          docker tag hello-react:1.0.0 frantzdimitrikubecloud/hello-react:1.0.0
          docker push frantzdimitrikubecloud/hello-react:1.0.0

  deploy-to-k8s:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: K8s deployment
        run: |
          kubectl apply -f k8s/
