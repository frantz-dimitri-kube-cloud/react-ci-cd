name: CI/CD React to On-Prem K8s

on:
  push:
    branches:
      - main

jobs:
  ci-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        run: |
          npm install
          npm run lint

  build-and-push:
    needs: ci-testing
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Login to Docker Hub via CLI
      #   run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Get version from release.version
        id: get_version
        run: |
          VERSION=$(cat release.version)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build -t hello-react:${{ env.VERSION }} .
          docker tag hello-react:${{ env.VERSION }} frantzdimitrikubecloud/hello-react:${{ env.VERSION }}
          docker push frantzdimitrikubecloud/hello-react:${{ env.VERSION }}

